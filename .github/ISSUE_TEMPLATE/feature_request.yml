name: Feature request
description: A check, an option or a change you would like
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The situation, and what the validator does not do for it now.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: For a new check, the rule or spec text it comes from, and an example that should fail.
    validations:
      required: true
