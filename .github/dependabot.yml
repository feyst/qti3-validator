# Minor and patch updates are merged automatically once CI passes (see
# workflows/dependabot.yml), and released by the next run of CI on main.
# Each ecosystem's updates come in one pull request, so one release.
#
# Not covered: github.com/jacoelho/xsd, which go.mod replaces with the patched
# copy in third_party/xsd. workflows/xsd-upstream.yml watches its releases.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
    groups:
      go:
        update-types: [minor, patch]
  # The golang image the binary is built with, and with it the standard
  # library's security fixes. Go is excluded from the default cooldown of 3
  # days: Go's fixes are not advisories on the image, so security updates,
  # which skip the cooldown, do not cover them.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
      exclude: [golang]
    groups:
      docker:
        update-types: [minor, patch]
  # The actions are pinned by commit, with the version in a comment behind
  # it; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
