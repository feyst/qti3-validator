name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Every night, so that dependency updates Dependabot merged are released:
  # a merge by a workflow's own token starts no new run.
  schedule:
    - cron: '17 3 * * *'
  # Actions → CI → Run workflow builds main. With auto it releases as a push
  # would, following the Release lines; patch, minor or major release with
  # that bump, also when nothing in the image changed.
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto follows the Release lines of the commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# A new push to a pull request cancels its running build. Runs of main and of
# tags are never cancelled while running and run one after the other, so two
# releases never pick the same version. GitHub keeps only one waiting run per
# group, so a waiting run (for example a manual release) is replaced when
# another one is queued behind it: start it again if that happens.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Test with the Go of the image, which Dependabot keeps up to date, so
      # govulncheck sees the standard library the image is built with.
      - name: Go version
        id: go
        run: echo "version=$(sed -n 's/^FROM .*golang:\([0-9.]*\).*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ steps.go.outputs.version }}
      - name: Fetch schemas
        run: make schemas
      - name: Install tools
        run: make tools
      - name: Lint
        run: make lint
      - name: Test
        run: make race
      - name: Vulnerabilities
        run: make vuln

  # Picks the next version for a build of main with
  # .github/scripts/next-version.sh: a patch release when anything that goes
  # into the image changed since the last tag vX.Y.Z, so code, dependencies,
  # rules or the Go version; a minor or major one for a line
  # `Release: minor` or `Release: major` in a commit since then; the chosen
  # bump when started by hand. A version whose image is already in a
  # registry is skipped. Empty when there is nothing to release. On a pull
  # request it tests the script instead.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      skipped: ${{ steps.next.outputs.skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test the version script
        if: github.event_name == 'pull_request'
        run: .github/scripts/next-version_test.sh
      - id: next
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          next=$(.github/scripts/next-version.sh 2> "$RUNNER_TEMP/next.log") || { cat "$RUNNER_TEMP/next.log"; exit 1; }
          cat "$RUNNER_TEMP/next.log"
          if [ -n "$next" ]; then echo "Releasing $next"; fi
          # The versions passed over, for the release notes: "v1.2.2 v1.2.3".
          skipped=$(sed -n 's/^Skipping \(v[0-9.]*\):.*/\1/p' "$RUNNER_TEMP/next.log" | xargs)
          { echo "tag=$next"; echo "skipped=$skipped"; } >> "$GITHUB_OUTPUT"

  # Builds the image for amd64 and arm64 and pushes it as
  # ghcr.io/feyst/qti3-validator, and as feyst/qti3-validator on Docker Hub
  # when the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are set. Tags:
  #   main           latest, main, sha-<commit>
  #   release        1.2.3, 1.2 as well
  #   tag v1.2.3     1.2.3, 1.2, sha-<commit>
  #   pull request   pr-<number>, sha-<commit> (ghcr.io only)
  # A pull request from a fork or from Dependabot is only built: the first
  # gets no token to push with, the second needs no image. The nightly run
  # builds only when it releases.
  image:
    needs: [check, version]
    if: github.event_name != 'schedule' || needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      # Whether the image went to Docker Hub too, for the release notes.
      dockerhub: ${{ steps.names.outputs.dockerhub }}
    env:
      PUSH: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
      DOCKERHUB: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}
      IMAGE: feyst/qti3-validator
      RELEASE: ${{ needs.version.outputs.tag }}
      # Put the OCI annotations on the multi-platform index too, where
      # registries read the description and source from.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # "Re-run failed jobs" does not run `version` again, so a run whose
      # image job failed after pushing the release would push it a second
      # time: Docker Hub refuses that, and ghcr.io would overwrite it.
      - name: Check that the release is not pushed yet
        if: env.RELEASE != ''
        run: |
          if .github/scripts/next-version.sh exists "${RELEASE#v}"; then
            echo "::error::The image ${RELEASE#v} is already in a registry. Use Re-run all jobs or start a new run, which picks the next version."
            exit 1
          elif [ $? -ne 1 ]; then
            exit 1
          fi

      - name: Image names and release tags
        id: names
        run: |
          {
            echo "ghcr=ghcr.io/$IMAGE"
            echo "dockerhub=$DOCKERHUB"
            echo 'images<<EOF'
            echo "ghcr.io/$IMAGE"
            if [ "$DOCKERHUB" = true ]; then echo "docker.io/$IMAGE"; fi
            echo EOF
            # The highest priority makes the release the version in the binary.
            echo 'release<<EOF'
            if [ -n "$RELEASE" ]; then
              v=${RELEASE#v}
              echo "type=raw,value=$v,priority=1000"
              echo "type=raw,value=${v%.*},priority=999"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.images }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            ${{ steps.names.outputs.release }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Dockerfile cross-compiles, so arm64 needs no emulation.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # A signed statement of which workflow built the image from which
      # commit; check it with `gh attestation verify oci://<image> -R <repo>`.
      # Attestations need a public repository, or GitHub Enterprise.
      - name: Attest
        if: env.PUSH == 'true' && github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.ghcr }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Docker Hub does not read the README from the repository or the image:
  # this copies README.md to its overview, with relative links made absolute.
  # The Docker Hub token needs the Read, Write, Delete scope for this.
  dockerhub-readme:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.DOCKERHUB == 'true'
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: env.DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: feyst/qti3-validator
          short-description: HTTP service that validates QTI 3 items, tests and packages against the 1EdTech schemas
          readme-filepath: README.md
          enable-url-completion: true

  # Tags the commit with an annotated tag and publishes a GitHub release once
  # its image is pushed. The tag is made by the workflow and not signed; the
  # build attestation on ghcr.io ties the image to the commit and the run.
  # A tag made with the workflow's own token starts no new run.
  release:
    needs: [version, image]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
      SKIPPED: ${{ needs.version.outputs.skipped }}
      IMAGE: feyst/qti3-validator
      DOCKERHUB: ${{ needs.image.outputs.dockerhub }}
    steps:
      - run: |
          v=${TAG#v}
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # A re-run after a failure further down finds the tag, and the
          # release, it made before; a tag on another commit is an error.
          if ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2> "$RUNNER_TEMP/ref.err"); then
            tagged=$(jq -r .object.sha <<< "$ref")
            if [ "$(jq -r .object.type <<< "$ref")" = tag ]; then
              tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tagged" --jq .object.sha)
            fi
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already tags $tagged, not $GITHUB_SHA"
              exit 1
            fi
            echo "$TAG already tags this commit"
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/ref.err"; then
            cat "$RUNNER_TEMP/ref.err"
            exit 1
          else
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$TAG" -f object="$GITHUB_SHA" -f type=commit \
              -f message="$TAG"$'\n\n'"Released by $run_url" --jq .sha)
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" > /dev/null
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release $TAG exists"
            exit 0
          fi
          # Indented: a code block in the notes. Docker Hub is named only
          # when the image was pushed there.
          notes="    docker pull ghcr.io/$IMAGE:$v"
          if [ "$DOCKERHUB" = true ]; then
            notes=$(printf '%s\n    docker pull %s:%s' "$notes" "$IMAGE" "$v")
          fi
          # A skipped version has an image from a release that failed before
          # it was tagged; it is not a release.
          if [ -n "$SKIPPED" ]; then
            notes=$(printf '%s\n\nSkipped: %s. An image with that version exists from a release that did not finish; it is not a release, use %s.' \
              "$notes" "${SKIPPED// /, }" "$TAG")
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$TAG" --generate-notes --notes "$notes"

  # Keeps one open issue labelled release-failure while builds of main fail,
  # with a comment per failed run, and closes it after the next build of main
  # that built and pushed the image without a failure. A cancelled run, or a
  # nightly run with nothing to release, leaves the issue as it is. The
  # nightly run released nothing for two weeks before anyone noticed; this
  # makes it noticed.
  report:
    needs: [check, version, image, dockerhub-readme, release]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      FAILED: ${{ contains(needs.*.result, 'failure') }}
      SUCCEEDED: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && needs.image.result == 'success' }}
    steps:
      - run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          open=$(gh issue list --label release-failure --state open --json number --jq '.[0].number // empty')
          if [ "$FAILED" = true ]; then
            body="The $GITHUB_EVENT_NAME build of main failed: $run_url"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh label create release-failure --color B60205 \
                --description 'A build of main failed; closed by the next one that succeeds' 2>/dev/null || true
              gh issue create --label release-failure --title 'Builds of main fail' \
                --body "$body"$'\n\n'"A failed build of main releases nothing. This issue gets a comment for every further failure and is closed by the next build of main that succeeds."
            fi
          elif [ "$SUCCEEDED" = true ] && [ -n "$open" ]; then
            gh issue close "$open" --comment "The $GITHUB_EVENT_NAME build of main succeeded again: $run_url"
          fi
