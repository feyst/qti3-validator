name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fetch schemas
        run: make schemas
      - name: Install tools
        run: make tools
      - name: Lint
        run: make lint
      - name: Test
        run: make race
      - name: Vulnerabilities
        run: make vuln

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t kennisnet/qti3-validator:ci .
