name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Every night, so that dependency updates Dependabot merged are released:
  # a merge by a workflow's own token starts no new run.
  schedule:
    - cron: '17 3 * * *'
  # Actions → CI → Run workflow releases main with the chosen version bump,
  # also when nothing in the image changed.
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

# A new push to a pull request cancels its running build; builds of main and
# of tags always finish, one after the other, so two releases never pick the
# same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Test with the Go of the image, which Dependabot keeps up to date, so
      # govulncheck sees the standard library the image is built with.
      - name: Go version
        id: go
        run: echo "version=$(sed -n 's/^FROM .*golang:\([0-9.]*\).*/\1/p' Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
      - name: Fetch schemas
        run: make schemas
      - name: Install tools
        run: make tools
      - name: Lint
        run: make lint
      - name: Test
        run: make race
      - name: Vulnerabilities
        run: make vuln

  # Picks the next version for a build of main: a patch release when anything
  # that goes into the image changed since the last tag vX.Y.Z, so code,
  # dependencies, rules or the Go version; the chosen bump when started by
  # hand. The first release is v0.1.0. Empty when there is nothing to release.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # Only plain vX.Y.Z tags count; a prerelease such as v1.1.0-rc.1
          # is neither a base to compare with nor one to count on from.
          releases() { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; }
          # The next number counts on from the highest release of all, so it
          # never repeats one, also when two tags share a commit or a tag
          # sits outside main.
          last=$(git tag --list 'v*' | releases | sort -V | tail -n 1)
          # Whether anything changed is asked of the nearest release in
          # main's history.
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            next=v0.1.0
          else
            if [ -z "$BUMP" ] && [ -n "$base" ] && git diff --quiet "$base" HEAD -- \
                go.mod go.sum Dockerfile cmd internal rules third_party ':!*_test.go'; then
              echo "Nothing in the image changed since $base"
              exit 0
            fi
            IFS=. read -r major minor patch <<< "${last#v}"
            case "${BUMP:-patch}" in
              major) next="v$((10#$major + 1)).0.0" ;;
              minor) next="v$((10#$major)).$((10#$minor + 1)).0" ;;
              *)     next="v$((10#$major)).$((10#$minor)).$((10#$patch + 1))" ;;
            esac
          fi
          echo "Releasing $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  # Builds the image for amd64 and arm64 and pushes it as
  # ghcr.io/feyst/qti3-validator, and as feyst/qti3-validator on Docker Hub
  # when the secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are set. Tags:
  #   main           latest, main, sha-<commit>
  #   release        1.2.3, 1.2 as well
  #   tag v1.2.3     1.2.3, 1.2, sha-<commit>
  #   pull request   pr-<number>, sha-<commit> (ghcr.io only)
  # A pull request from a fork or from Dependabot is only built: the first
  # gets no token to push with, the second needs no image. The nightly run
  # builds only when it releases.
  image:
    needs: [check, version]
    if: github.event_name != 'schedule' || needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') }}
      DOCKERHUB: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}
      IMAGE: feyst/qti3-validator
      RELEASE: ${{ needs.version.outputs.tag }}
      # Put the OCI annotations on the multi-platform index too, where
      # registries read the description and source from.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@v7

      - name: Image names and release tags
        id: names
        run: |
          echo "ghcr=ghcr.io/$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo 'images<<EOF'
            echo "ghcr.io/$IMAGE"
            if [ "$DOCKERHUB" = true ]; then echo "docker.io/$IMAGE"; fi
            echo EOF
            # The highest priority makes the release the version in the binary.
            echo 'release<<EOF'
            if [ -n "$RELEASE" ]; then
              v=${RELEASE#v}
              echo "type=raw,value=$v,priority=1000"
              echo "type=raw,value=${v%.*},priority=999"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.names.outputs.images }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            ${{ steps.names.outputs.release }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The Dockerfile cross-compiles, so arm64 needs no emulation.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # A signed statement of which workflow built the image from which
      # commit; check it with `gh attestation verify oci://<image> -R <repo>`.
      # Attestations need a public repository, or GitHub Enterprise.
      - name: Attest
        if: env.PUSH == 'true' && github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.names.outputs.ghcr }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Docker Hub does not read the README from the repository or the image:
  # this copies README.md to its overview, with relative links made absolute.
  # The Docker Hub token needs the Read, Write, Delete scope for this.
  dockerhub-readme:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        if: env.DOCKERHUB == 'true'
      - uses: peter-evans/dockerhub-description@v5
        if: env.DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: feyst/qti3-validator
          short-description: HTTP service that validates QTI 3 items, tests and packages against the 1EdTech schemas
          readme-filepath: README.md
          enable-url-completion: true

  # Tags the commit and publishes a GitHub release once its image is pushed.
  # A tag made with the workflow's own token starts no new run.
  release:
    needs: [version, image]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - run: |
          v=${TAG#v}
          notes="    docker pull ghcr.io/feyst/qti3-validator:$v
              docker pull feyst/qti3-validator:$v"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes --notes "$notes"
